name: Run acceptance tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run_acceptance_tests:
    name: Run acceptance tests
    runs-on:
      - self-hosted
      - windows
      - x64
      - rdss-nisyncbot-${{ matrix.configuration }}
    strategy:
      matrix:
        configuration: ["win-10-py32", "win-10-py64"]
        python-version: ["3.11", "3.14"]
      # Fail-fast skews the pass/fail ratio and seems to make pytest produce
      # incomplete JUnit XML results.
      fail-fast: false
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.configuration == 'win-10-py32' && 'x86' || 'x64' }}
      - name: Install dependencies
        run: poetry install
      - name: Run acceptance tests for PXIe-6674T
        run: poetry run pytest --resource_name="6674T" --junitxml=test_results/acceptance-${{ matrix.configuration }}-py${{ matrix.python-version }}.xml
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_results_acceptance_${{ matrix.configuration }}_py${{ matrix.python-version }}
          path: test_results/*.xml
        if: always()